services:
  postgres:
    image: postgres:15-alpine
    container_name: swms-postgres
    restart: always
    environment:
      POSTGRES_USER: swms_user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: swms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
